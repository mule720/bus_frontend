name: Deploy Bus Frontend (GooAfri)

on:
  push:
    branches: [master, main]

env:
  USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
  GCP_PROJECT: gooafri
  GCP_REGION: africa-south1
  GKE_CLUSTER: bus-cluster
  IMAGE: africa-south1-docker.pkg.dev/gooafri/gooafri/bus-frontend
  SA_EMAIL: gooafri-deployer@gooafri.iam.gserviceaccount.com
  WIF_PROVIDER: projects/673117935035/locations/global/workloadIdentityPools/github-pool/providers/github-provider

jobs:
  deploy:
    name: Build & Deploy Bus Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE auth plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker africa-south1-docker.pkg.dev --quiet

      - name: Build & Push Docker image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://api.gooafri.com \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER \
            --region $GCP_REGION \
            --project $GCP_PROJECT

      - name: Deploy to GKE
        run: |
          sed 's|IMAGE_PLACEHOLDER|${{ env.IMAGE }}:${{ github.sha }}|g' k8s/deployment.yaml \
            | kubectl apply -f -

      - name: Wait for rollout
        run: kubectl rollout status deployment/bus-frontend -n gooafri --timeout=120s

      - name: Verify
        run: |
          kubectl get pods -n gooafri -l app=bus-frontend
          kubectl get hpa -n gooafri
          echo ""
          echo "✅ Bus frontend deployed!"
          echo "🌐 https://www.gooafri.com | https://app.gooafri.com"
