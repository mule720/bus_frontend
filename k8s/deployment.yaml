apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus-frontend
  namespace: gooafri
  labels:
    app: bus-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bus-frontend
  template:
    metadata:
      labels:
        app: bus-frontend
    spec:
      containers:
      - name: bus-frontend
        image: IMAGE_PLACEHOLDER
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bus-frontend
  namespace: gooafri
spec:
  selector:
    app: bus-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bus-frontend-hpa
  namespace: gooafri
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bus-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
