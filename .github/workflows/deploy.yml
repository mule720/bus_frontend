name: Deploy Bus Frontend to VPS

# Was GKE-targeted (gooafri GCP project) - switched to the Hostinger VPS
# because that GCP project never had billing enabled, so the GKE pipeline
# was never actually live.
on:
  push:
    branches: [main, master]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/bus/bus_frontend
            git pull --ff-only
            docker build --build-arg VITE_API_BASE_URL='' -t bus-frontend:latest .
            docker rm -f bus-fe-extract 2>/dev/null || true
            docker create --name bus-fe-extract bus-frontend:latest
            rm -rf /var/www/bus/bus_frontend_dist/*
            docker cp bus-fe-extract:/usr/share/nginx/html/. /var/www/bus/bus_frontend_dist/
            docker rm bus-fe-extract
            docker image prune -f
